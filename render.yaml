services:
  - type: web
    name: threat-detection-agent-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    envVars:
      - key: CROO_BASE_URL
        value: https://api.croo.network
      - key: CROO_WS_URL
        value: wss://api.croo.network/ws
      - key: CROO_API_KEY
        sync: false
      - key: CROO_SERVICE_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUDIT_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: AUDIT_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: VIRUSTOTAL_TIMEOUT_SECONDS
        value: "3"
      - key: VIRUSTOTAL_CACHE_TTL_SECONDS
        value: "3600"
      - key: VIRUSTOTAL_SUBMIT_UNKNOWN_URLS
        value: "false"
      - key: DNS_REPUTATION_ENABLED
        value: "true"
      - key: DNS_TIMEOUT_SECONDS
        value: "2"
      - key: ML_CLASSIFIER_ENABLED
        value: "true"
      - key: ML_MODEL_PATH
        value: model/url_only_model.joblib
      - key: ML_FEATURE_MANIFEST_PATH
        value: model/feature_manifest.json
      - key: ML_PHISHING_THRESHOLD
        value: "0.5"
      - key: LLM_EXPLANATIONS_ENABLED
        value: "true"
      - key: DETERMINISTIC_EXPLANATION_FALLBACK_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: gemma2-9b-it
      - key: GROQ_TIMEOUT_SECONDS
        value: "4"
      - key: SCAN_HISTORY_ENABLED
        value: "true"
      - key: SCAN_HISTORY_DB_PATH
        value: data/scan_history.sqlite3
      - key: SCAN_HISTORY_RETENTION_LIMIT
        value: "500"
